<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Pose Match</title>
<style>
  :root {
    /* Black / white / silver. Colour appears only where a camera would use it:
       red for record, amber for the date stamp, green for focus lock. */
    --bg: #000;
    --panel: #101012;
    --panel-2: #17171a;
    --line: #2a2a2e;
    --text: #f4f4f5;
    --muted: #8a8a92;
    --silver: #c9c9d1;
    --rec: #ff3b30;
    --stamp: #ffb020;
    --af: #4ade80;
    --accent: #e8e8ec;          /* the "accent" is now just bright silver */
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    --shutter: 74px;
    --bar-h: 132px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.6 var(--mono);
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  /* Camera metadata: uppercase mono, the way a viewfinder overlays it. */
  .meta {
    font: 500 10.5px/1 var(--mono);
    letter-spacing: .1em;
    color: var(--silver);
  }

  /* Sensor grain. Kept very low — the nostalgia should come from the layout and
     the camera furniture, not from a filter pass over everything. */
  .grain {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter>\
<rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");
  }

  .view[hidden] { display: none; }

  /* The way into the gallery: the last frame you took, as a button — the same
     affordance a camera gives you. */
  .gal-btn {
    position: relative;
    width: 50px; height: 50px; flex: 0 0 auto; padding: 0;
    border: 1px solid rgba(255,255,255,.4);
    border-radius: 4px;
    background: rgba(255,255,255,.08);
    cursor: pointer; overflow: hidden;
  }
  .gal-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gal-btn .meta {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: #fff; font-size: 12px;
  }
  .gal-btn img:not([hidden]) + .meta {
    inset: auto 0 0 0; height: 17px;
    background: rgba(0,0,0,.6); font-size: 9px;
  }

  .gal-head {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 9px;
    padding: max(12px, env(safe-area-inset-top)) 18px 12px;
    background: linear-gradient(var(--bg) 72%, rgba(0,0,0,0));
  }

  /* ================= SPLASH ================= */

  /* The whole app hides behind this. It also earns its keep: starting the
     camera from a real click is far more reliable than doing it on load,
     which some browsers refuse without a user gesture. */
  .splash {
    position: fixed; inset: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    cursor: pointer;
    transition: opacity .38s ease;
  }
  .splash.gone { opacity: 0; pointer-events: none; }
  /* Hover has to be scoped to the artwork. .splash is fixed inset:0, so
     .splash:hover matches the cursor being anywhere on the page at all — the
     camera would swell on load and never shrink back. */
  .splash-inner {
    display: flex; flex-direction: column; align-items: center; gap: 26px;
  }
  .splash img {
    width: min(72vw, 58vh, 860px);
    height: auto; display: block;
    filter: drop-shadow(0 26px 60px rgba(0,0,0,.65));
    transition: transform .3s cubic-bezier(.2,.9,.3,1);
  }
  .splash-inner:hover img, .splash:focus-visible img { transform: scale(1.07); }
  .splash.press img { transform: scale(.96); }

  .splash-cta {
    display: inline-flex; align-items: center;
    font: 500 12px/1 var(--mono);
    letter-spacing: .22em;
    color: var(--muted);
    transition: color .2s ease;
  }
  .splash-inner:hover .splash-cta { color: var(--silver); }

  .splash:focus { outline: none; }
  .splash .pop {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
  }
  .splash.press .pop { animation: flashfade .38s ease-out; }

  /* ================= CAMERA (first screen) ================= */

  .camera {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
  }

  /* Full-bleed, exactly like the iOS viewfinder: the preview spans the whole
     screen width so a body is rendered at the same scale the system camera
     shows it. Sized in JS (layoutStage). */
  .stage {
    position: relative;
    background: #000;
    touch-action: none;
    overflow: hidden;
  }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  #video.mirrored { transform: scaleX(-1); }
  /* Fit mode: show the whole sensor frame and let the stage's black background
     become the letterbox bars, instead of cropping to fill. */
  #video.fit { object-fit: contain; }

  #ghost {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    opacity: 0;
    transform-origin: center center;
    will-change: transform, opacity;
  }
  #ghost.diff { mix-blend-mode: difference; }

  .grid-lines {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity .15s ease;
    background:
      linear-gradient(to right,  transparent 33.2%, rgba(255,255,255,.3) 33.2% 33.5%, transparent 33.5%,
                                 transparent 66.4%, rgba(255,255,255,.3) 66.4% 66.7%, transparent 66.7%),
      linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.3) 33.2% 33.5%, transparent 33.5%,
                                 transparent 66.4%, rgba(255,255,255,.3) 66.4% 66.7%, transparent 66.7%);
  }
  .grid-lines.on { opacity: 1; }

  .countdown {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font: 800 clamp(80px, 28vmin, 220px)/1 var(--mono);
    color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.6); pointer-events: none;
  }
  .countdown.on { display: flex; }
  @keyframes tick { from { transform: scale(1.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .countdown span { animation: tick .35s cubic-bezier(.2,1.3,.4,1); }

  /* Doubles as the front-facing "flash": the screen goes white before capture. */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  /* The mirror slap before the flash — a black beat is what actually reads as a
     shutter; a white flash alone reads as a screen effect. */
  .blink { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; }
  @keyframes blinkout { 0% { opacity: 1 } 100% { opacity: 0 } }
  .blink.fire { animation: blinkout .12s steps(2) both; }

  /* Photos arrive over-exposed and unresolved, then settle. */
  @keyframes develop {
    0%   { filter: brightness(1.7) saturate(.15) blur(7px); opacity: 0; }
    30%  { opacity: 1; }
    100% { filter: none; opacity: 1; }
  }
  .developing { animation: develop .8s ease-out both; }
  @keyframes flashfade { from { opacity: .9 } to { opacity: 0 } }
  .flash.fire { animation: flashfade .4s ease-out; }

  /* ---------- viewfinder furniture ---------- */

  /* Focus brackets in the corners. Pure decoration, so nothing can catch a
     pointer meant for the ghost underneath. */
  .brackets { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .brackets i {
    position: absolute; width: 26px; height: 26px;
    border: 1.5px solid rgba(255,255,255,.85);
  }
  .brackets i:nth-child(1) { top: 14px; left: 14px;  border-right: 0; border-bottom: 0; }
  .brackets i:nth-child(2) { top: 14px; right: 14px; border-left: 0;  border-bottom: 0; }
  .brackets i:nth-child(3) { bottom: 14px; left: 14px;  border-right: 0; border-top: 0; }
  .brackets i:nth-child(4) { bottom: 14px; right: 14px; border-left: 0;  border-top: 0; }
  .stage.locked .brackets i { border-color: var(--af); }

  .vf-top, .vf-bottom {
    position: absolute; left: 16px; right: 16px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: none; z-index: 3;
  }
  .vf-top { top: 16px; }
  .vf-bottom { bottom: 16px; justify-content: space-between; }
  .vf-spacer { flex: 1 1 auto; }

  .rec { display: inline-flex; align-items: center; gap: 6px; opacity: .35; }
  .rec.on { opacity: 1; }
  .rec .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
  .rec.on .dot { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  /* Date stamp, bottom right, in the amber every 2000s compact burned in. */
  .stamp { font: 500 12px/1 var(--mono); letter-spacing: .06em; color: var(--stamp);
           text-shadow: 0 0 8px rgba(255,176,32,.35); }

  .batt { display: inline-flex; align-items: center; gap: 4px; }
  .batt b { display: block; width: 16px; height: 9px; border: 1.5px solid var(--silver);
            border-radius: 2px; position: relative; }
  .batt b::before { content: ''; position: absolute; inset: 1.5px; right: 5px; background: var(--silver); }
  .batt b::after { content: ''; position: absolute; right: -3.5px; top: 2px; bottom: 2px;
                   width: 2px; background: var(--silver); border-radius: 0 1px 1px 0; }

  /* ---------- overlay controls ---------- */

  .cam-top {
    position: absolute;
    top: max(10px, env(safe-area-inset-top));
    left: 10px; right: 10px;
    display: flex; gap: 8px; justify-content: center;
    z-index: 4;
  }

  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 34px; padding: 0 13px;
    font: 500 11px/1 var(--mono);
    letter-spacing: .09em;
    color: var(--text);
    background: rgba(0, 0, 0, .5);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 3px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--silver); border-color: var(--silver); color: #0b0b0d; }

  /* iOS puts the shutter in a band at the bottom; this sits in the same place. */
  .cam-bar {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    height: calc(var(--bar-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 26px; padding-right: 26px;
    background: linear-gradient(to top, rgba(0,0,0,.82) 55%, rgba(0,0,0,0));
    z-index: 4;
  }

  .shutter {
    width: var(--shutter); height: var(--shutter);
    border-radius: 50%;
    border: 4px solid #fff;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(0,0,0,.35);
    cursor: pointer; padding: 0; flex: 0 0 auto;
  }
  .shutter:active:not(:disabled) { transform: scale(.93); }
  .shutter:disabled { opacity: .4; }

  .addbtn, .switch {
    width: 50px; height: 50px; flex: 0 0 auto;
    border-radius: 4px;
    border: 1px dashed rgba(255,255,255,.38);
    background: rgba(255,255,255,.1);
    color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 0;
  }
  .switch { border-radius: 50%; border-style: solid; font-size: 19px; }
  .addbtn.has { border-style: solid; overflow: hidden; padding: 0; }
  .addbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .scroll-hint {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom) + 6px);
    text-align: center;
    color: rgba(255,255,255,.75);
    font: 650 10px/1 var(--mono);
    letter-spacing: .16em;
    text-decoration: none;
    z-index: 5;
  }

  .stage-msg {
    position: absolute; inset: 0; display: none; z-index: 6;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
    background: rgba(0,0,0,.9);
  }
  .stage-msg.on { display: flex; }
  .stage-msg h2 { margin: 0; font-size: 16px; }
  .stage-msg p { margin: 0; color: var(--muted); font-size: 13px; max-width: 40ch; }
  .stage-msg code {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 11px; user-select: all;
    font: 12px/1.4 var(--mono);
  }

  /* ================= SETTINGS (scroll down) ================= */

  .settings {
    background: var(--bg);
    padding: 22px 18px calc(48px + env(safe-area-inset-bottom));
    max-width: 620px;
    margin: 0 auto;
    display: flex; flex-direction: column; gap: 18px;
    scroll-margin-top: 0;
  }
  .group { display: flex; flex-direction: column; gap: 9px; }
  .label {
    font-size: 12px;
    color: rgba(255, 255, 255, .42);
    font-weight: 400;
  }
  .chips-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* Three kinds of control, three appearances. Rendering "pick one of these",
     "on or off" and "do a thing" identically is what made the panel read as
     generic — the buttons said nothing about how they behave. */

  /* SEGMENTED — mutually exclusive. A camera menu strip: square, divided,
     with the active item inverted rather than tinted. */
  .seg {
    display: inline-flex;
    /* .group is a column flex container, so a child stretches to full width by
       default no matter that this is inline-flex. Shrink to the labels. */
    align-self: flex-start;
    max-width: 100%;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
    background: #131316;
    border: 1px solid #33333a;
    border-radius: 3px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .seg::-webkit-scrollbar { display: none; }
  .seg button {
    position: relative;
    appearance: none; -webkit-appearance: none;
    border: 0; background: transparent;
    color: #93939b;
    font: 500 11px/1 var(--mono);
    letter-spacing: .09em;
    padding: 10px 13px;
    border-radius: 2px;
    cursor: pointer; white-space: nowrap;
    transition: color .12s ease, background .12s ease;
  }
  .seg button:hover { color: #e6e6ea; }
  .seg button + button::before {
    content: '';
    position: absolute; left: 0; top: 26%; bottom: 26%;
    width: 1px; background: #2e2e34;
    transition: opacity .12s ease;
  }
  .seg button.on {
    background: var(--silver);
    color: #0b0b0d;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.28);
  }
  .seg button.on::before, .seg button.on + button::before { opacity: 0; }

  /* TOGGLE — a physical button with a lit state. Bevelled: light top edge,
     dark bottom edge, so it reads as a raised key rather than a flat swatch. */
  .toggle, .act {
    appearance: none; -webkit-appearance: none;
    font: 500 11px/1 var(--mono);
    letter-spacing: .09em;
    padding: 11px 14px;
    border-radius: 3px;
    cursor: pointer; white-space: nowrap;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .toggle {
    color: #93939b;
    background: linear-gradient(#1b1b1f, #131316);
    border: 1px solid #33333a;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 0 rgba(0,0,0,.7);
  }
  .toggle:hover { color: #e6e6ea; border-color: #45454e; }
  .toggle.on {
    background: linear-gradient(#dcdce2, #b4b4be);
    border-color: #c6c6ce;
    color: #0b0b0d;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 0 rgba(0,0,0,.7);
  }
  .toggle:disabled { opacity: .32; cursor: not-allowed; }
  .toggle:disabled:hover { color: #93939b; border-color: #33333a; }

  /* ACTION — flat plate, no fill until pressed. */
  .act {
    color: #93939b;
    background: transparent;
    border: 1px solid #33333a;
  }
  .act:hover:not(:disabled) { background: #17171b; color: #e6e6ea; border-color: #45454e; }
  .act:disabled { opacity: .32; cursor: not-allowed; }
  .act.primary {
    background: linear-gradient(#dcdce2, #b4b4be);
    border-color: #c6c6ce;
    color: #0b0b0d;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 1px 0 rgba(0,0,0,.7);
  }
  .act.primary:hover:not(:disabled) { filter: brightness(1.05); }

  .toggle:active, .act:active { transform: translateY(1px); box-shadow: none; }
  .seg button:active { transform: translateY(1px); }

  .slider-row { display: flex; align-items: center; gap: 12px; }
  .slider-row .val { color: var(--muted); font-size: 12px; min-width: 42px; text-align: right;
                     font-variant-numeric: tabular-nums; }
  input[type="range"] { flex: 1 1 auto; width: 100%; accent-color: var(--accent); height: 28px; }

  /* Contact sheet: frames with their filename under them, each sitting very
     slightly off-square the way prints do in a sleeve. */
  .shots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 10px; }
  .shots .cell { position: relative; transform: rotate(var(--tilt)); transition: transform .18s ease; }
  .shots .cell:nth-child(odd)  { --tilt: -1.1deg; }
  .shots .cell:nth-child(even) { --tilt:  0.9deg; }
  .shots .cell:hover { transform: rotate(0deg); }
  .shots img {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
    background: #000; border: 1px solid var(--line); cursor: pointer;
  }
  .shots .name {
    display: block; margin-top: 5px;
    font: 500 9px/1.2 var(--mono); letter-spacing: .06em;
    color: var(--muted); text-align: center;
  }
  /* Hovering a frame draws a focus box on it, the way a camera confirms one. */
  .shots .cell::after {
    content: ''; position: absolute; inset: -4px; pointer-events: none;
    border: 1px solid transparent; transition: border-color .15s ease;
  }
  .shots .cell:hover::after { border-color: rgba(255,255,255,.5); }
  .shots .cell.picked::after { border-color: var(--af); }
  .shots .cell .badge {
    position: absolute; top: 5px; left: 5px;
    min-width: 18px; height: 18px; padding: 0 4px;
    background: var(--af); color: #06210f;
    font: 700 10px/18px var(--mono); text-align: center;
    display: none;
  }
  .shots .cell.picked .badge { display: block; }

  .hint { color: var(--muted); font-size: 11.5px; margin: 0; }


  /* The shot you just took, against the pose you were matching. This is the
     first thing the gallery shows — the rest of the roll sits under it. */
  .latest { display: grid; gap: 11px; padding: 0 18px 16px; }
  .latest-row { display: flex; gap: 8px; }
  .lp { flex: 1 1 0; min-width: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .lp[hidden] { display: none; }
  .lp .holder {
    position: relative;
    width: 100%; aspect-ratio: 3 / 4;        /* width is definite here, so this resolves */
    max-height: 54vh;
    background: #0a0a0c; border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  }
  .lp img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .lp .cap { font: 500 10px/1 var(--mono); letter-spacing: .1em;
             color: var(--muted); text-align: center; }
  .latest-act { display: flex; gap: 8px; flex-wrap: wrap; }

  /* Frame pickers: the artwork itself is the button, and every frame sits on one
     rail so the whole set is comparable at a glance. The rail breaks out of the
     panel's 620px column, and scrolls sideways when the screen is too narrow. */
  .frame-rail {
    margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    padding: 2px 18px 8px; overflow-x: auto; scrollbar-width: thin;
  }
  /* max-content + auto margins centres the set when it fits and still scrolls
     from the start when it does not, which `justify-content: center` cannot do. */
  .frame-rail-track { display: flex; gap: 34px; width: max-content; margin: 0 auto; }
  .frame-group { display: flex; flex-direction: column; gap: 8px; }
  .frame-group[hidden] { display: none; }
  .sub {
    font: 500 9px/1 var(--mono); letter-spacing: .14em; color: #6f6f78;
  }
  .frame-opts { display: flex; gap: 9px; }
  .frame-opt {
    padding: 6px;
    background: #131316; border: 1px solid #33333a; border-radius: 3px;
    cursor: pointer; line-height: 0;
    transition: border-color .12s ease, background .12s ease, opacity .12s ease;
  }
  /* One height for every thumbnail, natural widths — so a wide digicam and a
     tall photostrip read as the same kind of thing on the rail. */
  .frame-opt img { height: 72px; width: auto; display: block; }
  .frame-opt:hover:not(:disabled) { border-color: #6a6a76; background: #17171b; }
  .frame-opt:disabled { opacity: .3; cursor: not-allowed; }
  .frame-opt .cap {
    display: block; margin-top: 6px; line-height: 1;
    font: 500 9px/1 var(--mono); letter-spacing: .08em; color: var(--muted); text-align: center;
  }
  .frame-empty { font: 500 11px/1.5 var(--mono); color: #4e4e57; }

  /* Hovering a frame option previews it over the photo itself, at the size you
     will actually judge it at. */
  .lp-pv {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 6px; background: rgba(8, 8, 10, .94);
    opacity: 0; transition: opacity .12s ease;
  }
  .lp-pv.on { opacity: 1; }
  .lp-pv canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; display: block; }

  /* strip editor */
  .strip-edit {
    position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.97);
  }
  .strip-edit.on { display: flex; }
  .strip-holder { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #strip-canvas { max-width: 100%; max-height: 100%; touch-action: none; cursor: grab; }
  #strip-canvas:active { cursor: grabbing; }

  /* ================= COMPARE ================= */

  .compare {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.97);
  }
  .compare.on { display: flex; }
  .compare-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .compare-head h2 { margin: 0; font-size: 15px; flex: 1 1 100%; }
  .compare-body {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 8px; justify-content: center; align-items: stretch;
  }
  /* flex:1 1 0 + min-width:0 — these hold only max-width-constrained images, so
     a content-based basis would collapse them to nothing. */
  .pane { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .pane .cap { font: 500 10px/1 var(--mono); letter-spacing: .1em;
               color: var(--muted); text-align: center; }
  .pane .holder { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
  .pane img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; margin: auto; display: block; }
  .stack { position: relative; flex: 1 1 100%; min-width: 0; display: none; }
  .stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stack img.top { opacity: .5; }
  .compare.stacked .side { display: none; }
  .compare.stacked .stack { display: block; }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .seg button { padding: 10px 11px; font-size: 12px; }
    .toggle, .act { padding: 10px 13px; font-size: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .countdown span { animation: none; }
  }
</style>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const stage = $('stage'), video = $('video'), ghost = $('ghost');
  const camera = $('camera'), msg = $('msg'), shootBtn = $('shoot'), compare = $('compare');

  // ---------- state ----------

  let stream = null;
  let facing = 'user';
  let ghostURL = null, shotURL = null;
  let shots = [];
  let shotSeq = 0;                // frame numbers on the card: img_0001.jpg
  let counting = false, delay = 0;
  let videoAspect = 3 / 4;
  // Default: 9:16 letterboxed — a story-shaped file with the camera's full
  // field of view, so nothing is cropped and nothing looks zoomed.
  // Set at startup by pickDefaultFrame(): phones start on a tall story frame,
  // laptops on the webcam's own shape.
  let targetAspect = 0;
  let fitMode = false;            // true = letterbox the frame instead of cropping it
  let framed = false;             // composite into the digicam frame at capture

  // Every frame lives here. Geometry is stored as fractions of its own artwork,
  // so it survives any output size — and adding one of your own is a data edit,
  // not another code path. `win` is a single window; `slots` is a list of them.
  // Cap the LONG side, not the width: a rotated frame capped on width would come
  // out smaller than the upright one and lose window resolution.
  const FRAMES = {
    digicam: [
      { id: 'dg1', src: 'digicam1.png', long: 1920,
        win: { x0: 0.2613, x1: 0.5784, y0: 0.3439, y1: 0.7637 } },   // landscape window
      { id: 'dg2', src: 'digicam2.png', long: 1920,
        win: { x0: 0.1215, x1: 0.5678, y0: 0.3473, y1: 0.8683 } },   // landscape window
      { id: 'dg3', src: 'digicam3.png', long: 1920,
        win: { x0: 0.1481, x1: 0.5914, y0: 0.3113, y1: 0.7868 } }    // landscape window
    ],
    polaroid: [
      { id: 'po1', src: 'polaroid1.png', long: 1400,
        win: { x0: 0.0688, x1: 0.9214, y0: 0.0631, y1: 0.7882 } },
      { id: 'po2', src: 'polaroid2.png', long: 1400,
        win: { x0: 0.0855, x1: 0.9079, y0: 0.0849, y1: 0.8072 } },
      { id: 'po3', src: 'polaroid3.png', long: 1400,
        win: { x0: 0.0825, x1: 0.9150, y0: 0.0812, y1: 0.8073 } }
    ],
    strip: [
      { id: 'st1', src: 'photostrip.png', long: 2048, slots: [
          { cx: 0.2457, cy: 0.2887, w: 0.2247, h: 0.1209, deg: -6.88 },
          { cx: 0.2623, cy: 0.4272, w: 0.2151, h: 0.1212, deg: -7.00 },
          { cx: 0.2930, cy: 0.5649, w: 0.2244, h: 0.1219, deg: -7.25 }
        ] }
    ]
  };
  const artCache = {};                     // id -> HTMLImageElement
  const artFailed = {};                    // id -> true when the file is missing

  // Preload every registered frame. A missing file marks that frame unavailable
  // rather than breaking the section it belongs to.
  function loadFrameArt() {
    for (const fam of Object.keys(FRAMES)) {
      for (const def of FRAMES[fam]) {
        const im = new Image();
        im.onerror = () => { artFailed[def.id] = true; renderFramePickers(); };
        im.onload = () => renderFramePickers();
        im.src = def.src;
        artCache[def.id] = im;
      }
    }
  }
  const artReady = def => {
    const a = artCache[def.id];
    return !!(a && a.complete && a.naturalWidth && !artFailed[def.id]);
  };
  const gt = { x: 0, y: 0, scale: 1, flip: false };

  const MIN_SCALE = 0.2, MAX_SCALE = 5;
  const LOG_SPAN = Math.log(MAX_SCALE);
  const sliderToScale = v => Math.exp((v / 50 - 1) * LOG_SPAN);
  const scaleToSlider = s => (Math.log(s) / LOG_SPAN + 1) * 50;

  // ---------- stage sizing ----------

  const stageAspect = () => targetAspect || videoAspect;

  // Full screen width, like the iOS viewfinder, so a body appears at the same
  // scale the system camera shows it. Only clamps if the frame would be taller
  // than the screen.
  function layoutStage() {
    const vw = document.documentElement.clientWidth;
    const vh = camera.clientHeight || window.innerHeight;
    if (!vw || !vh) return;
    const barH = $('cam-bar').offsetHeight || 0;
    const ar = stageAspect();

    let w = vw, h = w / ar;                    // full screen width, always
    if (h > vh) { h = vh; w = h * ar; }        // never taller than the screen

    // If the frame fits above the shutter band, seat it there — that is where
    // iOS puts a 4:3 preview. A taller frame (9:16) goes full-bleed instead and
    // the band overlays it, which is also what iOS does.
    const fitsAbove = h <= vh - barH;
    stage.style.marginBottom = fitsAbove ? barH + 'px' : '0px';
    stage.style.width = Math.round(w) + 'px';
    stage.style.height = Math.round(h) + 'px';
  }

  // ---------- views ----------

  // Two views, one document. Separate pages would mean separate blob URLs, and
  // every photo taken this session would be gone the moment you navigated.
  function showView(name) {
    $('view-camera').hidden = name !== 'camera';
    $('view-gallery').hidden = name !== 'gallery';
    window.scrollTo(0, 0);
    if (name === 'gallery') { renderLatest(); renderShots(); renderFramePickers(); }
  }

  // The newest frame, beside the pose it was aiming at.
  function renderLatest() {
    const s = shots[shots.length - 1];
    $('latest').hidden = !s;
    if (!s) return;
    $('lp-pv').hidden = true;
    $('lp-pv').classList.remove('on');
    const img = $('lat-shot');
    img.classList.remove('developing');
    void img.offsetWidth;                    // restart the animation, do not queue it
    if (justShot) img.classList.add('developing');
    img.src = s.url;
    $('lat-cap').textContent = s.name || 'frame';
    const has = !!ghostURL;
    $('lp-ref').hidden = !has;
    if (has) $('lat-ref').src = ghostURL;
  }

  // ---------- viewfinder readouts ----------

  function updateVF() {
    $('counter').textContent = 'img_' + String(shotSeq + 1).padStart(4, '0');
    // Nothing pops up after a shot any more, so the gallery button carries the
    // news: the newest frame as its thumbnail, with the count under it.
    const t = $('gal-thumb'), n = $('gal-n');
    const last = shots[shots.length - 1];
    t.hidden = !last;
    if (last) t.src = last.url;
    n.textContent = shots.length;
    // The self-timer is the one time a compact camera shows a blinking record dot.
    $('rec').classList.toggle('on', delay > 0);
  }

  function tickStamp() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    $('stamp').textContent =
      `${d.getFullYear()} ${p(d.getMonth() + 1)} ${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---------- messages ----------

  function showMsg(title, body, extraHTML, canRetry) {
    $('msg-title').textContent = title;
    $('msg-body').textContent = body || '';
    $('msg-extra').innerHTML = extraHTML || '';
    $('retry').hidden = !canRetry;
    msg.classList.add('on');
  }
  const hideMsg = () => msg.classList.remove('on');

  // ---------- camera ----------

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      showMsg('camera needs https or localhost',
        'browsers block the camera on file:// pages. serve the folder and reload:',
        '<code>python3 -m http.server 8000</code>');
      return;
    }

    stopCamera();
    showMsg('starting camera…', 'allow camera access when your browser asks.');

    // Only the LONG axis is constrained. Asking for 1080x1920 pins a 9:16 shape,
    // which makes the browser crop the sensor before we ever see the frame —
    // field of view lost for the whole session, no matter what we crop to later.
    // Leaving the aspect free gives us the native frame to crop from ourselves.
    const portrait = window.innerHeight >= window.innerWidth;
    const size = portrait ? { height: { ideal: 1920 } } : { width: { ideal: 1920 } };

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: Object.assign({ facingMode: facing }, size),
        audio: false
      });
    } catch (err) {
      const n = err && err.name;
      if (n === 'NotAllowedError' || n === 'SecurityError')
        showMsg('camera permission denied', 'allow camera access for this page, then tap below.', '', true);
      else if (n === 'NotFoundError' || n === 'OverconstrainedError')
        showMsg('no camera found', 'nothing matched that request.', '', true);
      else if (n === 'NotReadableError')
        showMsg('camera is busy', 'another app is using it. close it, then tap below.', '', true);
      else
        showMsg('could not start the camera', (err && err.message) || String(err), '', true);
      return;
    }

    video.srcObject = stream;
    await video.play().catch(() => {});
    readVideoAspect();
    hideMsg();
    shootBtn.disabled = false;
  }

  function readVideoAspect() {
    if (video.videoWidth) videoAspect = video.videoWidth / video.videoHeight;
    layoutStage();
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  // Say plainly how much of the camera's view each frame option keeps.

  // ---------- inspo ----------

  function loadGhost(file) {
    if (!file || !file.type.startsWith('image/')) return;
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    ghostURL = URL.createObjectURL(file);
    ghost.src = ghostURL;

    const btn = $('add');
    btn.classList.add('has');
    btn.textContent = '';
    const im = document.createElement('img');
    im.src = ghostURL; im.alt = 'Inspo';
    btn.appendChild(im);

    resetGhost();
    applyOpacity();
  }

  function clearGhost() {
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    ghostURL = null;
    ghost.removeAttribute('src');
    ghost.style.opacity = 0;
    const btn = $('add');
    btn.classList.remove('has');
    btn.textContent = '+';
    $('file').value = '';
  }

  function applyGhostTransform() {
    ghost.style.transform =
      `translate(${gt.x}px, ${gt.y}px) scale(${gt.scale}) scaleX(${gt.flip ? -1 : 1})`;
  }
  function setScale(s) {
    gt.scale = clamp(s, MIN_SCALE, MAX_SCALE);
    applyGhostTransform();
    syncZoomUI();
  }
  function syncZoomUI() {
    $('zoom').value = Math.round(clamp(scaleToSlider(gt.scale), 0, 100));
    $('zoom-val').textContent = Math.round(gt.scale * 100) + '%';
  }
  function resetGhost() { gt.x = 0; gt.y = 0; gt.scale = 1; gt.flip = false; applyGhostTransform(); syncZoomUI(); }
  function applyOpacity() { ghost.style.opacity = ghostURL ? ($('opacity').value / 100) : 0; }

  // ---------- capture ----------

  function capture() {
    // The gallery hides the viewfinder but not the stream, so without this the
    // shutter key would keep taking blind photos from the gallery.
    if (!stream || counting || $('view-camera').hidden) return;
    if (delay > 0) return runCountdown(delay);
    fireFlashThenGrab();
  }

  function runCountdown(secs) {
    counting = true;
    shootBtn.disabled = true;
    const el = $('countdown');
    el.classList.add('on');
    let left = secs;
    const paint = () => { el.innerHTML = '<span>' + left + '</span>'; };
    paint();
    const t = setInterval(() => {
      if (--left > 0) return paint();
      clearInterval(t);
      el.classList.remove('on');
      el.textContent = '';
      counting = false;
      shootBtn.disabled = false;
      fireFlashThenGrab();
    }, 1000);
  }

  // Phones have no front-facing LED — the screen is the flash. Light first, let
  // the sensor adjust for a beat, then grab.
  function fireFlashThenGrab() {
    const blink = $('blink'), flash = $('flash');
    for (const el of [blink, flash]) { el.classList.remove('fire'); void el.offsetWidth; }
    blink.classList.add('fire');
    flash.classList.add('fire');
    stage.classList.add('locked');                 // brackets confirm focus, then release
    setTimeout(() => stage.classList.remove('locked'), 550);
    const lit = $('screenflash').classList.contains('on') && facing === 'user';
    setTimeout(grab, lit ? 150 : 0);
  }

  function grab() {
    const sw = video.videoWidth, sh = video.videoHeight;
    if (!sw || !sh) return;
    if (framed) return grabFramed(sw, sh);
    grabPlain(sw, sh);
  }

  function grabPlain(sw, sh) {

    const boxAR = stage.clientWidth / stage.clientHeight;
    const srcAR = sw / sh;
    const mirrored = video.classList.contains('mirrored');
    const c = document.createElement('canvas');

    if (fitMode) {
      // Letterbox: keep the ENTIRE sensor frame and pad out to the target shape.
      // Nothing is discarded, so there is no apparent zoom — the cost is bars.
      let outW, outH;
      if (srcAR > boxAR) { outW = sw; outH = Math.round(sw / boxAR); }   // bars top/bottom
      else               { outH = sh; outW = Math.round(sh * boxAR); }   // bars left/right
      c.width = outW; c.height = outH;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, outW, outH);
      // Offsets are symmetric, so the same dx works mirrored or not.
      const dx = (outW - sw) / 2, dy = (outH - sh) / 2;
      if (mirrored) { ctx.translate(outW, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, dx, dy, sw, sh);
      return finishGrab(c);
    }

    // Reproduce the object-fit:cover crop the stage is showing, so the saved
    // photo is the visible framing rather than the whole sensor frame.
    let cw = sw, ch = sh;
    if (srcAR > boxAR) cw = sh * boxAR;      // source wider  -> trim the sides
    else               ch = sw / boxAR;      // source taller -> trim top/bottom
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;

    c.width = Math.round(cw);
    c.height = Math.round(ch);
    const ctx = c.getContext('2d');

    // Mirror to match the preview. Un-mirroring would flip the pose relative to
    // the ghost the user just lined themselves up against.
    if (mirrored) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, c.width, c.height);

    finishGrab(c);
  }

  // The photo goes BEHIND the artwork and shows through the transparent window,
  // so the frame's own shape decides the output — the frame-shape chips do not
  // apply here. The window is 3:4, the same as the sensor, so nothing is cropped.
  // Composites any drawable — the live video, or a photo already taken — into
  // the digicam window. Split out from capture so the frame can also be applied
  // after the fact, from the compare view.
  function composeFrame(src, sw, sh, mirrored, inset, def) {
    const art = artCache[def.id];
    const WIN = def.win, FRAME_OUT_LONG = def.long;
    const aw = art.naturalWidth, ah = art.naturalHeight;
    const scale = FRAME_OUT_LONG / Math.max(aw, ah);
    const upW = Math.round(aw * scale), upH = Math.round(ah * scale);   // upright size

    // Turn the frame on its side when its screen runs the other way from the
    // photo. dg1's screen is portrait, dg2 and dg3 are landscape, so "rotate for
    // a landscape photo" is not enough — it has to compare the two. A square
    // photo fits either way, so leave it upright.
    const winHoriz = (WIN.x1 - WIN.x0) * upW > (WIN.y1 - WIN.y0) * upH;
    const frameHoriz = sw !== sh && (sw > sh) !== winHoriz;
    const outW = frameHoriz ? upH : upW;
    const outH = frameHoriz ? upW : upH;

    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const ctx = c.getContext('2d');

    // Rotating 90deg clockwise swaps the window's axes: what was a vertical
    // 3:4 hole becomes a horizontal 4:3 one, and the x fraction is measured
    // from the far side.
    let wx, wy, ww, wh;
    if (frameHoriz) {
      wx = (1 - WIN.y1) * outW;  ww = (WIN.y1 - WIN.y0) * outW;
      wy = WIN.x0 * outH;        wh = (WIN.x1 - WIN.x0) * outH;
    } else {
      wx = WIN.x0 * outW;        ww = (WIN.x1 - WIN.x0) * outW;
      wy = WIN.y0 * outH;        wh = (WIN.y1 - WIN.y0) * outH;
    }

    // cover-crop the source to the window's shape
    const boxAR = ww / wh, srcAR = sw / sh;
    let cw = sw, ch = sh;
    if (srcAR > boxAR) cw = sh * boxAR; else ch = sw / boxAR;
    // Nudge the crop inward when the source is an already-saved photo. The
    // window is 0.747, not exactly 3:4, so a letterboxed 9:16 shot would
    // otherwise catch a ~4px sliver of its own black bar at each end.
    if (inset) { cw *= 1 - inset; ch *= 1 - inset; }
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;

    ctx.save();
    // 2px bleed: the alpha was eroded by 1px to kill the white halo, so the photo
    // is drawn slightly oversized to tuck under the frame edge instead of gapping.
    ctx.beginPath();
    ctx.rect(wx - 2, wy - 2, ww + 4, wh + 4);
    ctx.clip();
    if (mirrored) { ctx.translate(outW, 0); ctx.scale(-1, 1); }
    const dx = mirrored ? outW - (wx - 2) - (ww + 4) : wx - 2;
    ctx.drawImage(src, sx, sy, cw, ch, dx, wy - 2, ww + 4, wh + 4);
    ctx.restore();

    // artwork on top; background stays transparent
    if (frameHoriz) {
      ctx.save();
      ctx.translate(outW, 0);
      ctx.rotate(Math.PI / 2);
      ctx.drawImage(art, 0, 0, outH, outW);   // local axes are swapped under the rotation
      ctx.restore();
    } else {
      ctx.drawImage(art, 0, 0, outW, outH);
    }
    return c;
  }

  function grabFramed(sw, sh) {
    const def = FRAMES.digicam[0];
    const art = def && artCache[def.id];
    // If the artwork has not decoded yet, naturalWidth is 0 and every derived
    // dimension becomes NaN. Fall back to a normal shot rather than a dead canvas.
    if (!art || !art.complete || !art.naturalWidth) return grabPlain(sw, sh);
    finishGrab(composeFrame(video, sw, sh, video.classList.contains('mirrored'), 0, def),
               'png', 'framed');
  }

  // Apply a frame to a shot already on the card. It is already mirrored the way
  // it was captured, so it must not be mirrored again.
  function frameExisting(url, def) {
    const art = artCache[def.id];
    if (!art || !art.complete || !art.naturalWidth) return;
    const im = new Image();
    im.onload = () => finishGrab(
      composeFrame(im, im.naturalWidth, im.naturalHeight, false, 0.015, def), 'png', 'framed');
    im.src = url;
  }


  function finishGrab(c, ext, kind) {
    const png = ext === 'png';
    c.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const k = kind || 'photo';
      const stem = k === 'photo' ? 'img_' : k === 'strip' ? 'strip' : 'frm_';
      const name = stem + String(++shotSeq).padStart(4, '0') + '.' + (png ? 'png' : 'jpg');
      shots.push({ url, blob, ext: png ? 'png' : 'jpg', name, kind: k });
      shotURL = url;
      // Straight to the gallery, the way a booth hands you the print: the new
      // frame on top beside the reference, already selected so a frame is one
      // tap away, with the rest of the roll pushed down below it.
      justShot = true;
      sel = [shots.length - 1];
      showView('gallery');
      updateVF();          // the camera's gallery button, for when you go back
      justShot = false;
    }, png ? 'image/png' : 'image/jpeg', 0.92);
  }

  let justShot = false;           // only the frame that just landed should develop
  function renderShots() {
    const box = $('shots');
    box.textContent = '';
    shots.forEach((s, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const im = document.createElement('img');
      im.src = s.url; im.alt = s.name || ('Shot ' + (i + 1));
      if (i === shots.length - 1 && justShot) im.classList.add('developing');
      const cap = document.createElement('span');
      cap.className = 'name';
      cap.textContent = s.name || '';
      const badge = document.createElement('span');
      badge.className = 'badge';
      const at = sel.indexOf(i);
      if (at >= 0) { cell.classList.add('picked'); badge.textContent = at + 1; }
      cell.append(im, badge, cap);
      cell.addEventListener('click', () => toggleSel(i));
      box.appendChild(cell);
    });
    $('shots-group').hidden = shots.length === 0;
  }

  // ---------- photostrip ----------

  // Measured off the artwork with a min-area-rect fit, stored as fractions so
  // they hold at any output size. The HOLE is a pixel mask baked into the PNG;
  // these quads only decide each photo's framing and tilt, so small errors here
  // are invisible — the artwork masks the edges either way.
  let stripDef = null;            // which strip design is being composed
  let stripW = 0, stripH = 0;     // editor canvas size, in output pixels
  let stripView = [];             // per-slot pan/zoom, parallel to stripDef.slots
  const STRIP_SLOTS = () => (stripDef ? stripDef.slots : []);

  let sel = [];                   // shot indices, in tap order

  const selShots = () => sel.map(i => shots[i]).filter(Boolean);
  // Only an untouched photo can be framed — that is what keeps a frame from
  // being applied twice, or wrapped around a strip.
  const selFramable = n => sel.length === n && selShots().every(s => s.kind === 'photo');

  function clearSel() { sel = []; renderShots(); renderFramePickers(); }

  function toggleSel(i) {
    const at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1); else sel.push(i);
    renderShots(); renderFramePickers();
  }

  // Builds the picker for each family and sets what is reachable right now.
  function renderFramePickers() {
    $('frames-group').hidden = shots.length === 0;
    document.querySelectorAll('.frame-group').forEach(group => {
      const fam = group.dataset.fam;
      const defs = FRAMES[fam] || [];
      group.hidden = defs.length === 0 || shots.length === 0;
      const box = group.querySelector('.frame-opts');
      const need = fam === 'strip' ? 3 : 1;
      const enabled = selFramable(need);
      box.textContent = '';
      defs.forEach((def, n) => {
        const b = document.createElement('button');
        b.className = 'frame-opt';
        b.disabled = !enabled || !artReady(def);
        b.title = artReady(def) ? '' : def.src + ' not found';
        const im = document.createElement('img');
        im.src = def.src; im.alt = '';
        const cap = document.createElement('span');
        cap.className = 'cap';
        cap.textContent = String(n + 1).padStart(2, '0');
        b.append(im, cap);
        b.addEventListener('click', () => {
          if (b.disabled) return;
          hidePreview();
          if (fam === 'strip') openStripEditor(def);
          else frameExisting(shots[sel[0]].url, def);
        });
        if (!b.disabled) {
          // Touch has no hover; a tap would only flash the panel before committing.
          b.addEventListener('pointerenter', e => {
            if (e.pointerType !== 'touch') showPreview(fam, def);
          });
          b.addEventListener('pointerleave', hidePreview);
          b.addEventListener('focus', () => showPreview(fam, def));
          b.addEventListener('blur', hidePreview);
        }
        box.appendChild(b);
      });
      if (!defs.length) {
        const e = document.createElement('span');
        e.className = 'frame-empty';
        e.textContent = 'none yet';
        box.appendChild(e);
      }
    });

    const n = sel.length;
    $('sel-count').textContent = n ? `${n} selected` : '';
    $('cmp-open').disabled = n !== 1;
    $('sel-clear').disabled = n === 0;
    $('sel-hint').textContent = n === 0
      ? 'tap a photo to select it. tap three, in order, for a strip.'
      : n === 1
        ? (selShots()[0].kind === 'photo'
            ? 'pick a digicam or polaroid frame below.'
            : 'already framed — frames can only be applied once.')
        : n === 3 ? 'pick a photostrip below.' : `${n} selected — 1 for a frame, 3 for a strip.`;
  }

  // Photos sit BEHIND the artwork and show through the punched slots.
  // Pure: takes its geometry and its per-slot views as arguments, so the editor
  // and the hover preview render through the same code at different sizes.
  function paintStrip(ctx, def, stripW, stripH, views) {
    def.slots.forEach((q, i) => {
      const v = views[i];
      if (!v || !v.img || !v.img.naturalWidth) return;
      const bleed = stripW * 0.006;               // tuck under the paper edge
      const w = q.w * stripW + bleed, h = q.h * stripH + bleed;
      ctx.save();
      ctx.translate(q.cx * stripW, q.cy * stripH);
      ctx.rotate(q.deg * Math.PI / 180);
      ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
      const im = v.img;
      const s = Math.max(w / im.naturalWidth, h / im.naturalHeight) * v.scale;
      const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
      // Offsets are stored as a FRACTION of the available pan, so they stay
      // valid when the zoom changes instead of drifting out of the slot.
      const mx = Math.max(0, (dw - w) / 2), my = Math.max(0, (dh - h) / 2);
      ctx.drawImage(im, -dw / 2 + v.offX * mx, -dh / 2 + v.offY * my, dw, dh);
      ctx.restore();
    });
    ctx.drawImage(artCache[def.id], 0, 0, stripW, stripH);
  }

  function drawStrip() {
    const ctx = $('strip-canvas').getContext('2d');
    ctx.clearRect(0, 0, stripW, stripH);
    if (stripDef) paintStrip(ctx, stripDef, stripW, stripH, stripView);
  }

  // ---------- hover preview ----------

  const PREVIEW_LONG = 720;                // it fills the hero pane now, so paint it bigger
  const shotImg = {};                      // url -> decoded HTMLImageElement

  function decoded(url, cb) {
    let im = shotImg[url];
    if (im) {
      if (im.complete && im.naturalWidth) cb(im);
      else im.addEventListener('load', () => cb(im), { once: true });
      return;
    }
    im = shotImg[url] = new Image();
    im.addEventListener('load', () => cb(im), { once: true });
    im.src = url;
  }

  // Renders the selection into the frame at preview size. Same compositors the
  // real output uses, so what you see is what you get — only smaller.
  function buildPreview(fam, def, done) {
    const urls = selShots().map(s => s.url);
    if (!urls.length || !artReady(def)) return;
    const imgs = [];
    let left = urls.length;
    urls.forEach((u, i) => decoded(u, im => { imgs[i] = im; if (!--left) paint(); }));

    function paint() {
      if (fam === 'strip') {
        const art = artCache[def.id];
        const sc = PREVIEW_LONG / Math.max(art.naturalWidth, art.naturalHeight);
        const w = Math.round(art.naturalWidth * sc), h = Math.round(art.naturalHeight * sc);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        // Default view per slot: centred, unzoomed — exactly how the editor opens.
        paintStrip(c.getContext('2d'), def, w, h,
                   imgs.map(img => ({ img, offX: 0, offY: 0, scale: 1 })));
        done(c);
      } else {
        const im = imgs[0];
        done(composeFrame(im, im.naturalWidth, im.naturalHeight, false, 0.015,
                          Object.assign({}, def, { long: PREVIEW_LONG })));
      }
    }
  }

  let pvToken = 0, pvTimer = 0;

  function hidePreview() {
    clearTimeout(pvTimer);
    pvToken++;                             // any render still in flight is stale
    const p = $('lp-pv');
    p.classList.remove('on');
    pvTimer = setTimeout(() => { p.hidden = true; }, 140);
  }

  function showPreview(fam, def) {
    clearTimeout(pvTimer);
    const mine = ++pvToken;
    buildPreview(fam, def, c => {
      if (mine !== pvToken) return;        // pointer moved on while we painted
      const p = $('lp-pv');
      p.textContent = '';
      p.appendChild(c);
      p.hidden = false;
      requestAnimationFrame(() => p.classList.add('on'));
    });
  }

  function openStripEditor(def) {
    stripDef = def;
    const art = artCache[def.id];
    if (!artReady(def)) return;
    const sc = def.long / Math.max(art.naturalWidth, art.naturalHeight);
    stripW = Math.round(art.naturalWidth * sc);
    stripH = Math.round(art.naturalHeight * sc);
    const c = $('strip-canvas');
    c.width = stripW; c.height = stripH;

    stripView = def.slots.map(() => ({ img: null, offX: 0, offY: 0, scale: 1 }));
    sel.forEach((idx, i) => {
      const im = new Image();
      im.onload = drawStrip;
      im.src = shots[idx].url;
      stripView[i].img = im;
    });
    drawStrip();
    $('strip-edit').classList.add('on');
  }

  // canvas coords -> which slot, if any
  function slotAt(px, py) {
    const SL = STRIP_SLOTS();
    for (let i = 0; i < SL.length; i++) {
      const q = SL[i];
      const t = q.deg * Math.PI / 180;
      const dx = px - q.cx * stripW, dy = py - q.cy * stripH;
      const lx =  dx * Math.cos(t) + dy * Math.sin(t);
      const ly = -dx * Math.sin(t) + dy * Math.cos(t);
      if (Math.abs(lx) <= q.w * stripW / 2 && Math.abs(ly) <= q.h * stripH / 2) return i;
    }
    return -1;
  }

  function saveStrip() {
    $('strip-canvas').toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      shots.push({ url, blob, ext: 'png', kind: 'strip',
                   name: 'strip' + String(++shotSeq).padStart(4, '0') + '.png' });
      shotURL = url;
      $('strip-edit').classList.remove('on');
      sel = [];
      justShot = true;
      showView('gallery');
      updateVF();          // the gallery button's thumbnail and count
      justShot = false;
    }, 'image/png');
  }

  // ---------- compare ----------

  function openCompare(url) {
    const shot = shots.find(s => s.url === url);
    $('cmp-cap').textContent = (shot && shot.name) || 'frame';
    $('cmp-shot').classList.remove('developing');
    void $('cmp-shot').offsetWidth;
    if (justShot) $('cmp-shot').classList.add('developing');
    $('cmp-shot').src = url;
    $('stk-shot').src = url;
    const has = !!ghostURL;
    for (const el of [$('cmp-inspo'), $('stk-inspo')]) {
      if (has) el.src = ghostURL; else el.removeAttribute('src');
    }
    compare.querySelectorAll('.side')[0].style.display = has ? '' : 'none';
    $('stack-btn').disabled = !has;
    compare.classList.add('on');
  }
  function closeCompare() {
    compare.classList.remove('on', 'stacked');
    $('stack-btn').classList.remove('on');
  }

  // ---------- ghost drag / pinch ----------

  let dragging = false, lastX = 0, lastY = 0, pinchStart = 0, scaleStart = 1;
  const pointers = new Map();

  stage.addEventListener('pointerdown', e => {
    if (!ghostURL) return;
    pointers.set(e.pointerId, e);
    stage.setPointerCapture(e.pointerId);
    if (pointers.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
    else if (pointers.size === 2) { dragging = false; pinchStart = pinchDist(); scaleStart = gt.scale; }
  });

  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if (pointers.size === 2 && pinchStart) {
      const d = pinchDist();
      if (d) setScale(scaleStart * (d / pinchStart));
      return;
    }
    if (!dragging) return;
    gt.x += e.clientX - lastX;
    gt.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyGhostTransform();
  });

  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) dragging = false;
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  function pinchDist() {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  stage.addEventListener('wheel', e => {
    if (!ghostURL) return;
    e.preventDefault();
    setScale(gt.scale * (e.deltaY < 0 ? 1.06 : 0.94));
  }, { passive: false });

  // ---------- wiring ----------

  const fileInput = $('file');
  $('add').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => loadGhost(fileInput.files[0]));
  $('clear-ghost').addEventListener('click', clearGhost);
  $('reset-ghost').addEventListener('click', resetGhost);
  $('flip-ghost').addEventListener('click', () => { gt.flip = !gt.flip; applyGhostTransform(); });

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f) loadGhost(f);
  });
  document.addEventListener('paste', e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (it) loadGhost(it.getAsFile());
  });

  $('opacity').addEventListener('input', () => {
    $('op-val').textContent = $('opacity').value + '%';
    applyOpacity();
  });
  $('zoom').addEventListener('input', () => setScale(sliderToScale(+$('zoom').value)));

  const toggle = (btn, fn) => btn.addEventListener('click', () => { fn(); btn.classList.toggle('on'); });
  toggle($('diff'),    () => ghost.classList.toggle('diff'));
  toggle($('mirror'),  () => video.classList.toggle('mirrored'));
  toggle($('gridbtn'), () => $('grid').classList.toggle('on'));
  $('screenflash').addEventListener('click', () => $('screenflash').classList.toggle('on'));

  if (!FRAMES.digicam.length) $('framed').disabled = true;
  $('framed').addEventListener('click', () => {
    if ($('framed').disabled) return;
    framed = !framed;
    $('framed').classList.toggle('on', framed);
  });
  video.classList.add('mirrored');

  // Timer cycles off -> 3 -> 10, the way the iOS control does.
  const DELAYS = [0, 3, 10];
  $('timer').addEventListener('click', () => {
    delay = DELAYS[(DELAYS.indexOf(delay) + 1) % DELAYS.length];
    $('timer').textContent = delay ? `timer ${delay}s` : 'timer off';
    $('timer').classList.toggle('on', delay > 0);
    updateVF();
  });

  $('flip').addEventListener('click', () => {
    facing = facing === 'user' ? 'environment' : 'user';
    const wantMirror = facing === 'user';      // mirroring is a selfie convention
    video.classList.toggle('mirrored', wantMirror);
    $('mirror').classList.toggle('on', wantMirror);
    startCamera();
  });

  function applyFrame(b) {
    if (!b) return;
    targetAspect = parseFloat(b.dataset.ar) || 0;
    fitMode = b.dataset.fit === '1';
    video.classList.toggle('fit', fitMode);
    [...$('aspect-row').children].forEach(c => c.classList.toggle('on', c === b));
    layoutStage();
  }

  $('aspect-row').addEventListener('click', e => applyFrame(e.target.closest('button')));

  // Phones get the tall story frame; laptops get the webcam's own shape, which
  // is landscape and would be badly cropped by a 9:16 window. Coarse pointer
  // catches tablets too, which want the tall frame for the same reason phones do.
  function pickDefaultFrame() {
    const phone = matchMedia('(pointer: coarse)').matches
               || matchMedia('(max-width: 900px)').matches;
    const want = phone ? '[data-fit="1"]' : '[data-ar="0"]';
    applyFrame($('aspect-row').querySelector(want));
  }

  $('to-gallery').addEventListener('click', () => showView('gallery'));
  $('to-camera').addEventListener('click', () => showView('camera'));
  $('sel-clear').addEventListener('click', clearSel);
  $('cmp-open').addEventListener('click', () => {
    if (sel.length === 1) { shotURL = shots[sel[0]].url; openCompare(shotURL); }
  });
  $('strip-close').addEventListener('click', () => $('strip-edit').classList.remove('on'));
  $('strip-save').addEventListener('click', saveStrip);

  // drag a photo within its slot
  (() => {
    const c = $('strip-canvas');
    let slot = -1, lastX = 0, lastY = 0;
    const toCanvas = e => {
      const r = c.getBoundingClientRect();
      return [(e.clientX - r.left) * (c.width / r.width),
              (e.clientY - r.top) * (c.height / r.height)];
    };
    c.addEventListener('pointerdown', e => {
      const [x, y] = toCanvas(e);
      slot = slotAt(x, y);
      if (slot < 0) return;
      c.setPointerCapture(e.pointerId);
      lastX = x; lastY = y;
    });
    c.addEventListener('pointermove', e => {
      if (slot < 0) return;
      const [x, y] = toCanvas(e);
      const q = STRIP_SLOTS()[slot], v = stripView[slot];
      const t = q.deg * Math.PI / 180;
      const dx = x - lastX, dy = y - lastY;
      // rotate the drag into the slot's own frame, then express it as a
      // fraction of the pan headroom so it survives a later zoom change
      const lx =  dx * Math.cos(t) + dy * Math.sin(t);
      const ly = -dx * Math.sin(t) + dy * Math.cos(t);
      const im = v.img;
      if (im && im.naturalWidth) {
        const bleed = stripW * 0.006;
        const w = q.w * stripW + bleed, h = q.h * stripH + bleed;
        const s = Math.max(w / im.naturalWidth, h / im.naturalHeight) * v.scale;
        const mx = Math.max(1, (im.naturalWidth * s - w) / 2);
        const my = Math.max(1, (im.naturalHeight * s - h) / 2);
        v.offX = clamp(v.offX + lx / mx, -1, 1);
        v.offY = clamp(v.offY + ly / my, -1, 1);
      }
      lastX = x; lastY = y;
      drawStrip();
    });
    const end = e => { if (slot >= 0) { slot = -1; } };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('wheel', e => {
      const [x, y] = toCanvas(e);
      const i = slotAt(x, y);
      if (i < 0) return;
      e.preventDefault();
      const v = stripView[i];
      v.scale = clamp(v.scale * (e.deltaY < 0 ? 1.07 : 0.93), 1, 5);
      drawStrip();
    }, { passive: false });
  })();

  shootBtn.addEventListener('click', capture);
  $('retry').addEventListener('click', startCamera);
  $('retake').addEventListener('click', closeCompare);
  $('stack-btn').addEventListener('click', () => {
    compare.classList.toggle('stacked');
    $('stack-btn').classList.toggle('on');
  });
  function downloadShot(url) {
    if (!url) return;
    const a = document.createElement('a');
    a.href = url;
    const i = shots.findIndex(s => s.url === url);
    a.download = (shots[i] && shots[i].name) || ('pose-match-' + (i + 1) + '.jpg');
    a.click();
  }
  $('download').addEventListener('click', () => downloadShot(shotURL));
  $('lat-dl').addEventListener('click', () => downloadShot(shotURL));
  $('lat-cmp').addEventListener('click', () => { if (shotURL) openCompare(shotURL); });
  $('lat-again').addEventListener('click', () => showView('camera'));

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      if (compare.classList.contains('on')) closeCompare();
      else if ($('view-camera').hidden) showView('camera');   // shoot again
      else capture();
    }
    else if (k === 'escape' && compare.classList.contains('on')) closeCompare();
    else if (k === 'm') $('mirror').click();
    else if (k === 'g') $('gridbtn').click();
    else if (k === 'r') resetGhost();
    else if (k === '-' || k === '_') setScale(gt.scale / 1.1);
    else if (k === '=' || k === '+') setScale(gt.scale * 1.1);
    else if (k === '[' || k === ']') {
      const s = $('opacity');
      s.value = clamp(+s.value + (k === ']' ? 5 : -5), 0, 100);
      s.dispatchEvent(new Event('input'));
    }
  });

  // Phones report the new viewport a beat after the rotation event fires.
  const relayout = () => { layoutStage(); setTimeout(layoutStage, 250); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  video.addEventListener('loadedmetadata', readVideoAspect);

  // The camera starts on the splash click, not on load — see .splash.
  const splash = $('splash');
  function openApp() {
    if (splash.dataset.done) return;
    splash.dataset.done = '1';
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    splash.classList.add('press');
    setTimeout(() => {
      splash.classList.add('gone');
      setTimeout(() => { splash.style.display = 'none'; }, reduced ? 0 : 400);
      startCamera();
    }, reduced ? 0 : 150);
  }
  splash.addEventListener('click', openApp);
  splash.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(); }
  });

  loadFrameArt();          // without this the registry never resolves and every
  renderFramePickers();    // frame option stays disabled forever
  pickDefaultFrame();
  updateVF();
  tickStamp();
  setInterval(tickStamp, 20000);
  layoutStage();

  window.addEventListener('beforeunload', () => {
    stopCamera();
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    shots.forEach(s => URL.revokeObjectURL(s.url));
  });
})();
</script>
</body>
</html>
