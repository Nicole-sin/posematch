<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0e0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pose Match</title>
<style>
  :root {
    --bg: #0e0f14;
    --panel: #171922;
    --panel-2: #1f222e;
    --line: #2e3242;
    --text: #e9ebf2;
    --muted: #8d93a8;
    --accent: #ff6b9d;
    --accent-hi: #ff88b2;
    --pad-b: max(10px, env(safe-area-inset-bottom));
    --pad-t: max(8px, env(safe-area-inset-top));
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;          /* no pull-to-refresh while dragging the ghost */
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* ================= PHONE FIRST ================= */

  .app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  .stage-wrap {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--pad-t) 8px 6px;
  }

  /* Sized in JS (layoutStage) to the chosen output aspect. The video inside is
     object-fit:cover, so the stage box IS the crop — and grab() reproduces that
     same crop, which is what keeps preview and saved photo identical. */
  .stage {
    position: relative;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    touch-action: none;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
  }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  #video.mirrored { transform: scaleX(-1); }

  #ghost {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    pointer-events: none;
    opacity: 0;
    transform-origin: center center;
    will-change: transform, opacity;
  }
  #ghost.diff { mix-blend-mode: difference; }

  .grid-lines {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    transition: opacity .15s ease;
    background:
      linear-gradient(to right,  transparent 33.2%, rgba(255,255,255,.32) 33.2% 33.5%, transparent 33.5%,
                                 transparent 66.4%, rgba(255,255,255,.32) 66.4% 66.7%, transparent 66.7%),
      linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.32) 33.2% 33.5%, transparent 33.5%,
                                 transparent 66.4%, rgba(255,255,255,.32) 66.4% 66.7%, transparent 66.7%);
  }
  .grid-lines.on { opacity: 1; }

  .countdown {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    font: 800 clamp(80px, 26vmin, 200px)/1 inherit;
    color: #fff; text-shadow: 0 6px 40px rgba(0,0,0,.6); pointer-events: none;
  }
  .countdown.on { display: flex; }
  @keyframes tick { from { transform: scale(1.5); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .countdown span { animation: tick .35s cubic-bezier(.2,1.3,.4,1); }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  @keyframes flashfade { from { opacity: .85 } to { opacity: 0 } }
  .flash.fire { animation: flashfade .4s ease-out; }

  /* Floating controls over the stage */
  .stage-top {
    position: absolute; top: 10px; left: 10px; right: 10px;
    display: flex; gap: 8px; justify-content: flex-end;
    pointer-events: none;
  }
  .stage-top .chip { pointer-events: auto; }

  .chip {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 38px; padding: 0 13px;
    font: 650 12.5px/1 inherit;
    color: var(--text);
    background: rgba(20, 22, 30, 0.72);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px;
    cursor: pointer; white-space: nowrap;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #33101f; }
  .chip:disabled { opacity: .4; }

  .stage-msg {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 24px; text-align: center;
    background: rgba(14,15,20,.94);
  }
  .stage-msg.on { display: flex; }
  .stage-msg h2 { margin: 0; font-size: 16px; }
  .stage-msg p { margin: 0; color: var(--muted); font-size: 13px; max-width: 40ch; }
  .stage-msg code {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 11px; user-select: all;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* ---------- bottom control deck ---------- */

  .deck {
    flex: 0 0 auto;
    padding: 8px 12px var(--pad-b);
    display: flex; flex-direction: column; gap: 9px;
    background: var(--bg);
  }

  .brand { display: none; }

  .chips-row { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }

  .op-row { display: flex; align-items: center; gap: 10px; }
  .op-row .lbl { font-size: 11px; color: var(--muted); font-weight: 650; letter-spacing: .1em; }
  input[type="range"] { flex: 1 1 auto; width: 100%; accent-color: var(--accent); height: 26px; }

  .shoot-row { display: flex; align-items: center; gap: 12px; }
  .shoot-row .side { flex: 1 1 0; display: flex; }
  .shoot-row .side.right { justify-content: flex-end; }

  /* Big round shutter, thumb-reachable */
  .shutter {
    flex: 0 0 auto;
    width: 74px; height: 74px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.85);
    background: var(--accent);
    cursor: pointer; padding: 0;
    box-shadow: 0 6px 22px rgba(255,107,157,.35);
  }
  .shutter:active:not(:disabled) { transform: scale(.94); }
  .shutter:disabled { opacity: .35; box-shadow: none; }

  .addbtn {
    width: 54px; height: 54px; border-radius: 13px;
    border: 1.5px dashed var(--line); background: var(--panel);
    color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; padding: 0;
  }
  .addbtn.has { border-style: solid; overflow: hidden; }
  .addbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .morebtn {
    width: 54px; height: 54px; border-radius: 13px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--text); font: 650 11px/1.2 inherit; cursor: pointer; padding: 0;
  }

  /* Collapsible extras */
  .extra { display: none; flex-direction: column; gap: 9px; }
  .extra.on { display: flex; }
  .extra .label {
    font-size: 10px; letter-spacing: .13em; text-transform: uppercase;
    color: var(--muted); font-weight: 650;
  }
  .shots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .shots img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--line); background: #000; cursor: pointer;
  }
  .hint { color: var(--muted); font-size: 11px; margin: 0; }
  .kbd-hint { display: none; }

  /* ---------- compare ---------- */

  .compare {
    position: fixed; inset: 0; z-index: 30; display: none;
    flex-direction: column; gap: 10px;
    padding: var(--pad-t) 12px var(--pad-b);
    background: rgba(8,9,13,.97);
  }
  .compare.on { display: flex; }
  .compare-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .compare-head h2 { margin: 0; font-size: 15px; flex: 1 1 100%; }

  .compare-body {
    flex: 1 1 auto; min-height: 0;
    display: flex; gap: 8px; justify-content: center; align-items: stretch;
  }
  /* flex:1 1 0 + min-width:0 — these hold only max-width-constrained images, so
     a content-based basis would collapse them to nothing. */
  .pane { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .pane .cap { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 650; text-align: center; }
  .pane .holder { position: relative; flex: 1 1 auto; min-height: 0; display: flex; }
  .pane img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; margin: auto; display: block; }
  /* Same trap, worse: absolutely positioned children give this no intrinsic size. */
  .stack { position: relative; flex: 1 1 100%; min-width: 0; display: none; }
  .stack img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .stack img.top { opacity: .5; }
  .compare.stacked .side { display: none; }
  .compare.stacked .stack { display: block; }

  .btn {
    padding: 10px 13px; font: 650 13px/1 inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; white-space: nowrap; min-height: 40px;
  }
  .btn:hover:not(:disabled) { background: #2a2e3d; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.on { border-color: var(--accent); color: var(--accent-hi); background: rgba(255,107,157,.1); }

  /* ================= DESKTOP ================= */

  @media (min-width: 901px) {
    .app { flex-direction: row; gap: 14px; padding: 14px; }
    .stage-wrap { padding: 0; }
    .deck {
      flex: 0 0 320px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      overflow-y: auto;
      gap: 13px;
    }
    .brand { display: block; }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
    .extra { display: flex; }          /* nothing is collapsed on desktop */
    .morebtn { display: none; }
    .shots { grid-template-columns: repeat(3, 1fr); }
    .kbd-hint { display: block; }
    kbd {
      background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 2px;
      border-radius: 5px; padding: 1px 5px; font: 11px/1.5 ui-monospace, Menlo, monospace;
    }
  }
</style>
</head>
<body>

<div class="app">
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <img id="ghost" alt="">
      <div class="grid-lines" id="grid"></div>
      <div class="countdown" id="countdown"></div>
      <div class="flash" id="flash"></div>

      <div class="stage-top">
        <button class="chip" id="gridbtn">Grid</button>
        <button class="chip" id="diff">Diff</button>
        <button class="chip" id="flip" hidden>Flip</button>
      </div>

      <div class="stage-msg on" id="msg">
        <h2 id="msg-title">Starting camera…</h2>
        <p id="msg-body"></p>
        <div id="msg-extra"></div>
        <button class="btn" id="retry" hidden>Try again</button>
      </div>
    </div>
  </div>

  <div class="deck">
    <div class="brand">
      <h1>Pose Match</h1>
      <p>Upload a pose, match it live, shoot.</p>
    </div>

    <!-- Output shape. Vertical by default on a phone. -->
    <div class="chips-row" id="aspect-row">
      <button class="chip on" data-ar="0.5625">9:16</button>
      <button class="chip" data-ar="0.8">4:5</button>
      <button class="chip" data-ar="1">1:1</button>
      <button class="chip" data-ar="0">Full</button>
    </div>

    <div class="op-row">
      <span class="lbl">GHOST</span>
      <input type="range" id="opacity" min="0" max="100" value="45" aria-label="Ghost opacity">
      <span class="lbl" id="op-val">45%</span>
    </div>

    <div class="chips-row">
      <button class="chip on" id="t0">Now</button>
      <button class="chip" id="t3">3s</button>
      <button class="chip" id="t10">10s</button>
      <button class="chip on" id="mirror">Mirror</button>
    </div>

    <div class="shoot-row">
      <div class="side">
        <button class="addbtn" id="add" title="Inspo photo" aria-label="Choose inspo photo">+</button>
      </div>
      <button class="shutter" id="shoot" disabled aria-label="Take photo"></button>
      <div class="side right">
        <button class="morebtn" id="morebtn">More</button>
      </div>
    </div>

    <div class="extra" id="extra">
      <div class="chips-row">
        <button class="chip" id="reset-ghost">Reset fit</button>
        <button class="chip" id="flip-ghost">Flip ghost</button>
        <button class="chip" id="clear-ghost">Clear inspo</button>
      </div>
      <div id="shots-group" hidden>
        <span class="label">This session</span>
        <div class="shots" id="shots"></div>
      </div>
      <p class="hint">Drag the ghost to move it. Pinch or scroll to resize.</p>
      <p class="hint kbd-hint">
        <kbd>space</kbd> shoot &nbsp; <kbd>m</kbd> mirror &nbsp; <kbd>g</kbd> grid &nbsp;
        <kbd>[</kbd><kbd>]</kbd> opacity &nbsp; <kbd>r</kbd> reset
      </p>
    </div>

    <input type="file" id="file" accept="image/*" hidden>
  </div>
</div>

<div class="compare" id="compare">
  <div class="compare-head">
    <h2>How close did you get?</h2>
    <button class="btn" id="stack-btn">Superimpose</button>
    <button class="btn" id="download">Download</button>
    <button class="btn" id="retake">Back</button>
  </div>
  <div class="compare-body">
    <div class="pane side"><span class="cap">Inspo</span><div class="holder"><img id="cmp-inspo" alt="Inspo"></div></div>
    <div class="pane side"><span class="cap">Yours</span><div class="holder"><img id="cmp-shot" alt="Your photo"></div></div>
    <div class="stack" id="stack">
      <img id="stk-shot" alt="Your photo">
      <img id="stk-inspo" class="top" alt="Inspo">
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  const stage = $('stage'), video = $('video'), ghost = $('ghost');
  const msg = $('msg'), shootBtn = $('shoot'), compare = $('compare');

  // ---------- state ----------

  let stream = null;
  let facing = 'user';
  let ghostURL = null, shotURL = null;
  let shots = [];
  let counting = false, delay = 0;
  let videoAspect = 9 / 16;
  let targetAspect = 9 / 16;      // 0 = use the camera's native shape
  const gt = { x: 0, y: 0, scale: 1, flip: false };

  const isPhone = () => window.matchMedia('(max-width: 900px)').matches;

  // ---------- stage sizing ----------

  // The stage box defines the OUTPUT crop: fit it inside the available area at
  // the chosen aspect, let the video cover it, and whatever sits inside the box
  // is exactly what gets saved.
  const stageAspect = () => targetAspect || videoAspect;

  function layoutStage() {
    const wrap = stage.parentElement;
    const aw = wrap.clientWidth, ah = wrap.clientHeight;
    if (!aw || !ah) return;
    const ar = stageAspect();
    let w = aw, h = w / ar;
    if (h > ah) { h = ah; w = h * ar; }
    stage.style.width = Math.round(w) + 'px';
    stage.style.height = Math.round(h) + 'px';
  }

  // ---------- messages ----------

  function showMsg(title, body, extraHTML, canRetry) {
    $('msg-title').textContent = title;
    $('msg-body').textContent = body || '';
    $('msg-extra').innerHTML = extraHTML || '';
    $('retry').hidden = !canRetry;
    msg.classList.add('on');
  }
  const hideMsg = () => msg.classList.remove('on');

  // ---------- camera ----------

  async function startCamera() {
    if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
      showMsg('Camera needs https or localhost',
        'Browsers block the camera on file:// pages. Serve the folder and reload from the address it prints:',
        '<code>python3 -m http.server 8000</code>');
      return;
    }

    stopCamera();
    showMsg('Starting camera…', 'Allow camera access when your browser asks.');

    // Ask for a tall frame when the screen is tall, so a phone hands back a
    // portrait stream rather than a wide one we would crop most of away.
    const portrait = window.innerHeight >= window.innerWidth;
    const size = portrait
      ? { width: { ideal: 1080 }, height: { ideal: 1920 } }
      : { width: { ideal: 1920 }, height: { ideal: 1080 } };

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: Object.assign({ facingMode: facing }, size),
        audio: false
      });
    } catch (err) {
      const n = err && err.name;
      if (n === 'NotAllowedError' || n === 'SecurityError')
        showMsg('Camera permission denied', 'Allow camera access for this page, then tap below.', '', true);
      else if (n === 'NotFoundError' || n === 'OverconstrainedError')
        showMsg('No camera found', 'Nothing matched that request. Try flipping the camera.', '', true);
      else if (n === 'NotReadableError')
        showMsg('Camera is busy', 'Another app is using it. Close that app, then tap below.', '', true);
      else
        showMsg('Could not start the camera', (err && err.message) || String(err), '', true);
      return;
    }

    video.srcObject = stream;
    await video.play().catch(() => {});
    readVideoAspect();
    hideMsg();
    shootBtn.disabled = false;

    try {
      const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      $('flip').hidden = cams.length < 2;
    } catch (_) {}
  }

  function readVideoAspect() {
    if (video.videoWidth) videoAspect = video.videoWidth / video.videoHeight;
    layoutStage();
  }

  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  // ---------- inspo ----------

  function loadGhost(file) {
    if (!file || !file.type.startsWith('image/')) return;
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    ghostURL = URL.createObjectURL(file);
    ghost.src = ghostURL;

    const btn = $('add');
    btn.classList.add('has');
    btn.textContent = '';
    const im = document.createElement('img');
    im.src = ghostURL;
    im.alt = 'Inspo';
    btn.appendChild(im);

    resetGhost();
    applyOpacity();
  }

  function clearGhost() {
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    ghostURL = null;
    ghost.removeAttribute('src');
    ghost.style.opacity = 0;
    const btn = $('add');
    btn.classList.remove('has');
    btn.textContent = '+';
    $('file').value = '';
  }

  function applyGhostTransform() {
    ghost.style.transform =
      `translate(${gt.x}px, ${gt.y}px) scale(${gt.scale}) scaleX(${gt.flip ? -1 : 1})`;
  }
  function resetGhost() { gt.x = 0; gt.y = 0; gt.scale = 1; gt.flip = false; applyGhostTransform(); }
  function applyOpacity() { ghost.style.opacity = ghostURL ? ($('opacity').value / 100) : 0; }

  // ---------- capture ----------

  function capture() {
    if (!stream || counting) return;
    if (delay > 0) return runCountdown(delay);
    grab();
  }

  function runCountdown(secs) {
    counting = true;
    shootBtn.disabled = true;
    const el = $('countdown');
    el.classList.add('on');
    let left = secs;
    const paint = () => { el.innerHTML = '<span>' + left + '</span>'; };
    paint();
    const t = setInterval(() => {
      if (--left > 0) return paint();
      clearInterval(t);
      el.classList.remove('on');
      el.textContent = '';
      counting = false;
      shootBtn.disabled = false;
      grab();
    }, 1000);
  }

  function grab() {
    const sw = video.videoWidth, sh = video.videoHeight;
    if (!sw || !sh) return;

    // Reproduce the object-fit:cover crop the stage is showing, so the saved
    // photo is the visible framing rather than the whole sensor frame.
    const boxAR = stage.clientWidth / stage.clientHeight;
    const srcAR = sw / sh;
    let cw = sw, ch = sh;
    if (srcAR > boxAR) cw = sh * boxAR;      // source wider  -> trim the sides
    else               ch = sw / boxAR;      // source taller -> trim top/bottom
    const sx = (sw - cw) / 2, sy = (sh - ch) / 2;

    const c = document.createElement('canvas');
    c.width = Math.round(cw);
    c.height = Math.round(ch);
    const ctx = c.getContext('2d');

    // Mirror to match the preview. Un-mirroring would flip the pose relative to
    // the ghost the user just lined themselves up against.
    if (video.classList.contains('mirrored')) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, sx, sy, cw, ch, 0, 0, c.width, c.height);

    const flash = $('flash');
    flash.classList.remove('fire'); void flash.offsetWidth; flash.classList.add('fire');

    c.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      shots.push({ url, blob });
      shotURL = url;
      renderShots();
      openCompare(url);
    }, 'image/jpeg', 0.92);
  }

  function renderShots() {
    const box = $('shots');
    box.textContent = '';
    shots.forEach((s, i) => {
      const im = document.createElement('img');
      im.src = s.url; im.alt = 'Shot ' + (i + 1);
      im.addEventListener('click', () => { shotURL = s.url; openCompare(s.url); });
      box.appendChild(im);
    });
    $('shots-group').hidden = shots.length === 0;
  }

  // ---------- compare ----------

  function openCompare(url) {
    $('cmp-shot').src = url;
    $('stk-shot').src = url;
    const has = !!ghostURL;
    for (const el of [$('cmp-inspo'), $('stk-inspo')]) {
      // src="" resolves to the page URL and fires a bogus request — unset it.
      if (has) el.src = ghostURL; else el.removeAttribute('src');
    }
    compare.querySelectorAll('.side')[0].style.display = has ? '' : 'none';
    $('stack-btn').disabled = !has;
    compare.classList.add('on');
  }
  function closeCompare() {
    compare.classList.remove('on', 'stacked');
    $('stack-btn').classList.remove('on');
  }

  // ---------- ghost drag / pinch ----------

  let dragging = false, lastX = 0, lastY = 0, pinchStart = 0, scaleStart = 1;
  const pointers = new Map();

  stage.addEventListener('pointerdown', e => {
    if (!ghostURL) return;
    pointers.set(e.pointerId, e);
    stage.setPointerCapture(e.pointerId);
    if (pointers.size === 1) { dragging = true; lastX = e.clientX; lastY = e.clientY; }
    else if (pointers.size === 2) { dragging = false; pinchStart = pinchDist(); scaleStart = gt.scale; }
  });

  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, e);
    if (pointers.size === 2 && pinchStart) {
      const d = pinchDist();
      if (d) gt.scale = clamp(scaleStart * (d / pinchStart), 0.2, 5);
      return applyGhostTransform();
    }
    if (!dragging) return;
    gt.x += e.clientX - lastX;
    gt.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyGhostTransform();
  });

  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
    if (pointers.size === 0) dragging = false;
  };
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);

  function pinchDist() {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  }

  stage.addEventListener('wheel', e => {
    if (!ghostURL) return;
    e.preventDefault();
    gt.scale = clamp(gt.scale * (e.deltaY < 0 ? 1.06 : 0.94), 0.2, 5);
    applyGhostTransform();
  }, { passive: false });

  // ---------- wiring ----------

  const fileInput = $('file');
  $('add').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => loadGhost(fileInput.files[0]));
  $('clear-ghost').addEventListener('click', clearGhost);
  $('reset-ghost').addEventListener('click', resetGhost);
  $('flip-ghost').addEventListener('click', () => { gt.flip = !gt.flip; applyGhostTransform(); });

  ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
  document.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (f) loadGhost(f);
  });
  document.addEventListener('paste', e => {
    const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (it) loadGhost(it.getAsFile());
  });

  $('opacity').addEventListener('input', () => {
    $('op-val').textContent = $('opacity').value + '%';
    applyOpacity();
  });

  const toggle = (btn, fn) => btn.addEventListener('click', () => { fn(); btn.classList.toggle('on'); });
  toggle($('diff'),    () => ghost.classList.toggle('diff'));
  toggle($('mirror'),  () => video.classList.toggle('mirrored'));
  toggle($('gridbtn'), () => $('grid').classList.toggle('on'));
  video.classList.add('mirrored');

  $('morebtn').addEventListener('click', () => {
    const open = $('extra').classList.toggle('on');
    $('morebtn').textContent = open ? 'Less' : 'More';
  });

  $('flip').addEventListener('click', () => {
    facing = facing === 'user' ? 'environment' : 'user';
    const wantMirror = facing === 'user';      // mirroring is a selfie convention
    video.classList.toggle('mirrored', wantMirror);
    $('mirror').classList.toggle('on', wantMirror);
    startCamera();
  });

  // Output shape
  $('aspect-row').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    targetAspect = parseFloat(b.dataset.ar) || 0;
    [...$('aspect-row').children].forEach(c => c.classList.toggle('on', c === b));
    layoutStage();
  });

  const timers = { t0: 0, t3: 3, t10: 10 };
  Object.keys(timers).forEach(id => $(id).addEventListener('click', () => {
    delay = timers[id];
    Object.keys(timers).forEach(o => $(o).classList.toggle('on', o === id));
  }));

  shootBtn.addEventListener('click', capture);
  $('retake').addEventListener('click', closeCompare);
  $('stack-btn').addEventListener('click', () => {
    compare.classList.toggle('stacked');
    $('stack-btn').classList.toggle('on');
  });
  $('download').addEventListener('click', () => {
    if (!shotURL) return;
    const a = document.createElement('a');
    a.href = shotURL;
    a.download = 'pose-match-' + (shots.findIndex(s => s.url === shotURL) + 1) + '.jpg';
    a.click();
  });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || e.code === 'Space') { e.preventDefault(); compare.classList.contains('on') ? closeCompare() : capture(); }
    else if (k === 'escape' && compare.classList.contains('on')) closeCompare();
    else if (k === 'm') $('mirror').click();
    else if (k === 'g') $('gridbtn').click();
    else if (k === 'r') resetGhost();
    else if (k === '[' || k === ']') {
      const s = $('opacity');
      s.value = clamp(+s.value + (k === ']' ? 5 : -5), 0, 100);
      s.dispatchEvent(new Event('input'));
    }
  });

  // Phones report the new viewport a beat after the rotation event fires.
  const relayout = () => { layoutStage(); setTimeout(layoutStage, 250); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', relayout);
  video.addEventListener('loadedmetadata', readVideoAspect);

  // Vertical is the phone default; desktop starts on the camera's own shape.
  if (!isPhone()) {
    targetAspect = 0;
    [...$('aspect-row').children].forEach(c => c.classList.toggle('on', c.dataset.ar === '0'));
  }

  $('retry').addEventListener('click', startCamera);

  layoutStage();
  startCamera();

  window.addEventListener('beforeunload', () => {
    stopCamera();
    if (ghostURL) URL.revokeObjectURL(ghostURL);
    shots.forEach(s => URL.revokeObjectURL(s.url));
  });
})();
</script>
</body>
</html>
